format = 1
name = "lefty"
version = "1.0.0"
api = 1
minOmniWM = "0.8.0"
author = "csavur"
license = "GPL-2.0-only"
tags = ["blue", "light", "dark", "animated"]
title = "Lefty"
summary = "A quiet bar with pill-shaped workspaces, a blue accent and a slow glow."
previews = ["left.png"]

[barEffect]
title = "Glow"
values = [
    { type = "number", title = "Intensity", min = 0, max = 1, step = 0.05 },
    { type = "number", title = "Motion Speed", min = 0, max = 4, step = 0.1 },
    { type = "number", title = "Spark Size", min = 0, max = 3, step = 0.1 },
    { type = "number", title = "Glow Height", min = 0.1, max = 1, step = 0.05 },
]
